name: Terraform CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-ci.yml'

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: '1.6.0'
  TF_INPUT: false
  TF_IN_AUTOMATION: true

jobs:
  validate:
    name: Validate & Lint
    runs-on: self-hosted
    defaults:
      run:
        working-directory: terraform/environments/prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Terraform Init
        id: init
        run: terraform init -backend=false
      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

  plan:
    name: Plan
    runs-on: self-hosted
    needs: validate
    defaults:
      run:
        working-directory: terraform/environments/prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Terraform Init
        id: init
        run: |
          terraform init \
            -backend-config="conn_str=${{ secrets.TF_BACKEND_CONN_STR }}&sslmode=disable"
      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false
        env:
          TF_VAR_backend_conn_str: ${{ secrets.TF_BACKEND_CONN_STR }}

  apply:
    name: Apply
    runs-on: self-hosted
    needs: [validate, plan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    defaults:
      run:
        working-directory: terraform/environments/prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="conn_str=${{ secrets.TF_BACKEND_CONN_STR }}&sslmode=disable"
      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false
        env:
          TF_VAR_backend_conn_str: ${{ secrets.TF_BACKEND_CONN_STR }}
